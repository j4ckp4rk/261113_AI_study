name: Deploy Pages
on:
  push:
    branches: [ccr-2db40dc5-yo4eaa]
    paths: ['hbm-encyclopedia/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hbm-encyclopedia
      - id: deployment
        uses: actions/deploy-pages@v4
